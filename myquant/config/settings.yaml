# myquant 全局参数配置
# 由 myquant/config/__init__.py 加载，支持 ${ENV_VAR} 形式的环境变量占位

# ---------- 路径（相对 myquant/ 包目录） ----------
paths:
  results: results
  logs: logs
  cache: .cache

# ---------- 日志 ----------
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: strategy.log

# ---------- 回测默认参数 ----------
backtest:
  initial_capital: 100000 # 初始资金
  start_date: "2024-01-01" # 默认回测起始日
  end_date: "2025-12-31" # 默认回测结束日
  risk_per_trade: 0.02 # 单笔交易风险占总资金比例
  max_position_pct: 0.8 # 最大仓位占资金比例
  min_position_size: 1 # 最小下单数量

# ---------- 各市场默认交易参数 ----------
# margin_rate=1.0 表示全额保证金（现货/股票）；contract_multiplier 为合约乘数
markets:
  cn_stock:
    currency: CNY
    commission: 0.00025
    slippage: 0.001
    margin_rate: 1.0
    contract_multiplier: 1
  us_stock:
    currency: USD
    commission: 0.0005
    slippage: 0.001
    margin_rate: 1.0
    contract_multiplier: 1
  crypto:
    currency: USDT
    commission: 0.001
    slippage: 0.001
    margin_rate: 1.0
    contract_multiplier: 1
  futures:
    currency: CNY
    commission: 0.0003
    slippage: 0.001
    margin_rate: 0.10
    contract_multiplier: 10

# ---------- 品种级参数（覆盖所属 market 的默认值） ----------
instruments:
  RB0:
    name: 螺纹钢主连
    market: futures
    exchange: SHF
    commission: 0.0003
    margin_rate: 0.10
    contract_multiplier: 10
    slippage: 0.001
  CU0:
    name: 铜主连
    market: futures
    exchange: SHF
    commission: 0.00005
    margin_rate: 0.08
    contract_multiplier: 5
    slippage: 0.001
  IF0:
    name: 沪深300主连
    market: futures
    exchange: CFFEX
    commission: 0.000023
    margin_rate: 0.12
    contract_multiplier: 300
    slippage: 0.001
